rootProject.name = 'tomlj-examples'

// Build the examples against the library in the parent directory, in place of the published org.tomlj:tomlj.
includeBuild('..') {
  dependencySubstitution {
    substitute module('org.tomlj:tomlj') using project(':')
  }
}

include '01-reading-a-document'
include '02-reporting-errors'
include '03-building-a-document'
include '04-editing-in-place'
include '05-choosing-the-output-format'
include '06-walking-the-model'
include '07-reading-comments'
include '08-binding-a-document'
include '09-binding-to-records'
include '10-binding-with-options'
include '11-reporting-binding-errors'
include '12-writing-bound-records'
