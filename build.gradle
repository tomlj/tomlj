import java.util.regex.Pattern
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
  id 'antlr'
  id 'java-library'
  id 'jacoco'
  id 'maven-publish'
  id 'signing'
  id 'com.diffplug.spotless' version '8.10.2'
  id 'com.github.jk1.dependency-license-report' version '3.1.4'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'net.ltgt.errorprone' version '5.1.1'
  id 'com.gradleup.shadow' version '9.6.1'
}

description = 'A parser for Tom\'s Obvious, Minimal Language (TOML).'

//////
// Version numbering

def versionNumber = '1.2.0'
version = versionNumber + buildTag()

static String buildTag() {
  if (System.getenv('BUILD_RELEASE') == 'true') {
    return ''
  }
  if (System.getenv('CIRCLECI')) {
    def buildNumber = System.getenv('CIRCLE_SHA1').take(4).toUpperCase() +
      String.format('%02X', System.getenv('CIRCLE_BUILD_NUM').toInteger() % 256, 16)
    return '-' + buildNumber + '-snapshot'
  }
  return '-dev'
}

//////
// Dependencies and licensing checks

repositories {
  mavenCentral()
  gradlePluginPortal()
  // The official TOML test suite is not published as an artifact; fetch the tagged source archive
  // from GitHub and treat it as a dependency so that it is cached and versioned like any other.
  exclusiveContent {
    forRepository {
      ivy {
        name = 'github-toml-test'
        url = 'https://github.com/'
        patternLayout {
          artifact '[organisation]/[module]/archive/refs/tags/v[revision].[ext]'
        }
        metadataSources { artifact() }
      }
    }
    filter { includeModule('toml-lang', 'toml-test') }
  }
}

configurations {
  tomlTest {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
  }
}

apply from: "${rootDir}/dependency-versions.gradle"

// Check that the licenses of our 3rd party dependencies are in the accepted list in
// gradle/allowed-licenses.json. Run it with "./gradlew checkLicense". License names are
// normalized by the plugin's default bundle before matching, and the full report is written
// under build/reports/dependency-license.
licenseReport {
  configurations = ['runtimeClasspath']
  filters = [
    new com.github.jk1.license.filter.LicenseBundleNormalizer()
  ]
  allowedLicensesFile = layout.projectDirectory.file('gradle/allowed-licenses.json')
}

check.dependsOn checkLicense

//////
// Default tasks and build aliases

defaultTasks 'build', 'checkLicense', 'javadoc'

def buildAliases = ['dev': [
    'spotlessApply',
    'build',
    'checkLicense',
    'javadoc'
  ]]

def expandedTaskList = []
gradle.startParameter.taskNames.each {
  expandedTaskList << (buildAliases[it] ? buildAliases[it] : it)
}
gradle.startParameter.taskNames = expandedTaskList.flatten()

//////
// Source formatting

spotless {
  groovyGradle {
    target '**/*.gradle'
    greclipse().configFile(rootProject.file('gradle/greclipse-gradle-style.properties'))
    endWithNewline()
  }
  java {
    target project.fileTree(rootDir) {
      include 'src/**/*.java'
      exclude '**/generated-src/**/*.*'
    }
    removeUnusedImports()
    licenseHeaderFile rootProject.file('gradle/spotless.license.java')
    eclipse().configFile(rootProject.file('gradle/eclipse-java-style.xml'))
    importOrder 'org.tomlj', 'java', ''
    endWithNewline()
  }
}

//////
// Source generation

generateGrammarSource {
  // Output lands in build/generated-src/antlr/main/org/tomlj/internal, derived from the grammar file
  // location. The parser grammar imports the lexer's .tokens file, which ANTLR only finds via -lib.
  arguments << "-visitor" << "-long-messages"
  def libDir = file(outputDirectory.path + "/org/tomlj/internal")
  arguments << "-lib" << libDir.absolutePath
  doFirst { libDir.mkdirs() }
}

configurations {
  api {
    extendsFrom = extendsFrom.findAll { it != configurations.antlr }
  }
}

//////
// Compilation

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'

java {
  withJavadocJar()
  withSourcesJar()
}

sourcesJar.dependsOn generateGrammarSource

jacoco { toolVersion = '0.8.15' }

// The library targets Java 9; tests use JUnit 6, which requires Java 17.
compileJava.options.release = 9
compileTestJava.options.release = 17

tasks.withType(JavaCompile) {
  options.compilerArgs += [
    '-Xlint:unchecked',
    '-Xlint:cast',
    '-Xlint:rawtypes',
    '-Xlint:overloads',
    '-Xlint:divzero',
    '-Xlint:finally',
    '-Xlint:static',
    '-Werror'
  ]

  options.errorprone {
    excludedPaths = '.*/generated-src/.*'
    check('UnnecessaryParentheses', CheckSeverity.OFF)
    check('StringConcatToTextBlock', CheckSeverity.OFF)
    disableWarningsInGeneratedCode = true
  }
}

//////
// Testing

tasks.withType(Test) {
  // If GRADLE_MAX_TEST_FORKS is not set, use half the available processors
  maxParallelForks = (System.getenv('GRADLE_MAX_TEST_FORKS') ?:
  (Runtime.runtime.availableProcessors().intdiv(2) ?: 1)).toInteger()
}

// The official TOML test suite (https://github.com/toml-lang/toml-test) is extracted into the build
// directory and run by TomlTestSuiteTest.
def tomlTestDir = layout.buildDirectory.dir('toml-test')

tasks.register('extractTomlTest', Sync) {
  description = 'Extracts the official TOML test suite used by TomlTestSuiteTest.'
  from(configurations.tomlTest.elements.map { archives ->
    archives.collect {
      tarTree(it)
    }
  })
  include '*/tests/**'
  eachFile {
    it.relativePath = new RelativePath(true, it.relativePath.segments.drop(2))
  }
  includeEmptyDirs = false
  into tomlTestDir
}

test {
  useJUnitPlatform()
  dependsOn extractTomlTest
  inputs.dir(tomlTestDir).withPathSensitivity(PathSensitivity.RELATIVE)
  systemProperty 'org.tomlj.tomlTestDir', tomlTestDir.get().asFile.absolutePath
}

task jacocoRootTestReport(type: JacocoReport) {
  reports {
    html.required = true
    xml.required = true
    csv.required = false
  }
  doFirst {
    executionData = files(executionData.findAll { it.exists() })
  }
}

//////
// Documentation

javadoc { exclude '**/internal/**' }

//////
// Dependencies

dependencies {
  errorprone('com.google.errorprone:error_prone_core')

  antlr 'org.antlr:antlr4'

  implementation 'org.antlr:antlr4-runtime'
  implementation 'org.checkerframework:checker-qual'

  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'

  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  tomlTest 'toml-lang:toml-test@tar.gz'
}

//////
// Packaging

ext.moduleName = "org.tomlj"

jar {
  destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
  inputs.property("moduleName", moduleName)
  manifest {
    attributes('Implementation-Title': project.name,
    'Implementation-Version': project.version,
    'Automatic-Module-Name': moduleName)
  }
}

shadowJar {
  configurations = [
    project.configurations.compileClasspath
  ]
  dependencies {
    exclude(dependency('org.checkerframework:checker-qual'))
  }
  exclude '**/pom.xml'
  exclude '**/pom.properties'
  relocate 'org.antlr', 'org.tomlj.internal.antlr'
  minimize()
  manifest {
    attributes 'Description': 'This archive embeds a copy of the required ANTLR4 runtime library'
  }
}

task deploy() { }

dependencyManagement {
  generatedPomCustomization {
    enabled = false
  }
}

publishing {
  publications {
    tomljLibrary(MavenPublication) {
      from components.java
      groupId = 'org.tomlj'
      artifactId = base.archivesName.get()
      version = project.version
      versionMapping {
        usage('java-api') {
          fromResolutionOf('runtimeClasspath')
        }
        usage('java-runtime') {
          fromResolutionResult()
        }
      }
      pom {
        name = base.archivesName.get()
        description = project.description
        url = 'https://github.com/tomlj/tomlj'
        packaging = 'jar'
        licenses {
          license {
            name = "The Apache License, Version 2.0"
            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
          }
        }
        scm {
          connection = 'scm:https://github.com/tomlj/tomlj.git'
          developerConnection = 'scm:git@github.com:tomlj/tomlj.git'
          url = 'https://github.com/tomlj/tomlj'
        }
        developers {
          developer {
            name = 'Chris Leishman'
            email = 'chris@leishman.org'
          }
          developer {
            name = 'Tobias Schmidt'
            email = 'tobias.schmidt24080878@gmail.com'
          }
        }
      }
    }
  }
  if (System.getenv('MAVEN_CENTRAL_DEPLOY') == 'true') {
    repositories {
      maven {
        credentials {
          username = "$ossrhUsername"
          password = "$ossrhPassword"
        }
        url = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
      }
    }
  }
}

tasks.withType(GenerateModuleMetadata) {
  enabled = false
}

signing {
  useGpgCmd()
  sign publishing.publications.tomljLibrary
}

tasks.withType(Sign) {
  onlyIf { System.getenv('ENABLE_SIGNING') == 'true' }
}

tasks.named('generatePomFileForTomljLibraryPublication') {
  destination = layout.buildDirectory.file('generated-pom.xml').get().asFile
}
