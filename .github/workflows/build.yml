name: "Build"
on: [push, pull_request]

jobs:
  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: "Build, test, check licenses, and generate javadoc"
        run: ./gradlew build checkLicense javadoc
      - name: "Build and run the examples"
        run: ./gradlew -p examples check
      - name: "Upload test reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
