name: "Build"
on: [push, pull_request]

jobs:
  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last version listed is the default; 8 runs the Java 8 smoke test.
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: "Build, test, check licenses, and generate javadoc"
        run: ./gradlew build checkLicense javadoc
      - name: "Run the smoke test on Java 8"
        run: ./gradlew java8Test -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - name: "Upload test reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
